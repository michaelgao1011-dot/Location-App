<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip Trail</title>
<meta name="description" content="Track where you go on a trip, save the places you stop, and pin your photos to them.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trip Trail">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F3F4FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0C14" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous">
<style>
/* Layout: the map is the whole screen. A glass "live card" and a floating tab dock sit on top of it;
   Journal, Buddies and Me slide over the map as full panels. On wide screens the panels become a left column. */
:root{
  --bg:#F3F4FA; --card:#FFFFFF; --glass:rgba(255,255,255,.86);
  --ink:#0E1020; --ink-2:#5A5F7A; --line:#E2E5F1; --fill:#ECEEF7;
  --pop:#FF3D81; --pop-b:#FF8A3D; --on-pop:#23040F;
  --buddy:#3D5AFE; --on-buddy:#FFFFFF; --sun:#FFC93C;
  --ok:#0E9F6E; --danger:#D92D4B;
  --shadow:0 10px 30px rgba(20,22,50,.16);
  --f-display:"Bricolage Grotesque",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans","Apple SD Gothic Neo","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans","Apple SD Gothic Neo","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --dock-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0B0C14; --card:#161826; --glass:rgba(22,24,38,.84);
    --ink:#F3F4FB; --ink-2:#9BA0BE; --line:#272A3F; --fill:#1F2234;
    --pop:#FF5C97; --pop-b:#FF9A57; --on-pop:#23040F;
    --buddy:#8494FF; --on-buddy:#0B0C14; --sun:#FFD25E;
    --ok:#3DDC97; --danger:#FF7A8F;
    --shadow:0 10px 30px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--f-body);-webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--buddy);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-size:30px;font-weight:800;line-height:1.05}
h2{font-size:20px;font-weight:800}
h3{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-family:var(--f-body)}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

#app{position:fixed;inset:0;overflow:hidden}
.stage{position:absolute;inset:0}
#map{position:absolute;inset:0;background:var(--fill);z-index:0}
.map-fail{position:absolute;inset:0;display:grid;place-items:center;padding:32px;text-align:center;color:var(--ink-2);z-index:1}

/* ---- floating top bar ---- */
.top{position:absolute;z-index:500;top:calc(var(--safe-t) + 10px);left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.top>*{pointer-events:auto}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);font-weight:700;min-width:0}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill.round{width:44px;padding:0;justify-content:center;flex:none}
.pill.on{color:var(--pop)}
.top-right{display:flex;gap:8px;flex:none}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ink-2);flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 25%,transparent)}

/* ---- live card ---- */
.live{position:absolute;z-index:500;left:12px;right:12px;bottom:calc(var(--safe-b) + var(--dock-h) + 22px);padding:14px;border-radius:28px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.live-row{display:flex;align-items:center;gap:12px}
.ring{--p:0;width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--pop) calc(var(--p)*1turn),var(--fill) 0)}
.ring>div{width:46px;height:46px;border-radius:50%;background:var(--card);display:grid;place-items:center;font:800 14px var(--f-display);font-variant-numeric:tabular-nums}
.ring.done{background:var(--ok)}
.ring.idle>div{color:var(--ink-2)}
.live-text{flex:1;min-width:0;display:flex;flex-direction:column}
.live-text strong{font:800 18px/1.15 var(--f-display);letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live-text span{font-size:13px;color:var(--ink-2)}
.cta{min-height:50px;padding:0 22px;border-radius:999px;font:800 16px var(--f-display);background:linear-gradient(135deg,var(--pop),var(--pop-b));color:var(--on-pop);flex:none;box-shadow:0 6px 18px color-mix(in srgb,var(--pop) 40%,transparent)}
.cta.halt{background:var(--ink);color:var(--bg);box-shadow:none}
.cta:active,.btn:active,.tab:active{transform:scale(.97)}
.live-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--fill);border-radius:999px;padding:3px}
.seg button{min-height:36px;padding:0 13px;border-radius:999px;font-size:13px;font-weight:700;color:var(--ink-2)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 13px;border-radius:999px;background:var(--fill);font-size:13px;font-weight:700}
.chip svg.i{width:17px;height:17px}
@media (max-width:479px){.chip{width:44px;padding:0;justify-content:center}.chip span{display:none}.chip svg.i{width:20px;height:20px}}
.spacer{flex:1}

/* ---- tab dock ---- */
.tabs{position:absolute;z-index:700;left:12px;right:12px;bottom:calc(var(--safe-b) + 10px);height:var(--dock-h);display:grid;grid-template-columns:repeat(4,1fr);padding:6px;border-radius:26px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--shadow)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:20px;font-size:11px;font-weight:700;color:var(--ink-2)}
.tab[aria-current=page]{background:var(--ink);color:var(--bg)}
.badge{position:absolute;top:5px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--pop);color:var(--on-pop);font:800 11px/18px var(--f-display);text-align:center}

/* ---- panels ---- */
.panel{position:absolute;inset:0;z-index:600;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--safe-t) + 22px) 16px calc(var(--safe-b) + var(--dock-h) + 34px);display:none;flex-direction:column;gap:18px}
#app[data-tab=journal] #panel-journal,#app[data-tab=buddies] #panel-buddies,#app[data-tab=me] #panel-me{display:flex}
.panel>*{flex:none}
.card{background:var(--card);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row>.grow{flex:1;min-width:0}
.muted{color:var(--ink-2);font-size:14px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--card);border-radius:18px;padding:10px 14px;display:flex;flex-direction:column;min-width:84px}
.stat b{font:800 22px var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:999px;background:var(--fill);font-weight:700;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.pop{background:linear-gradient(135deg,var(--pop),var(--pop-b));color:var(--on-pop)}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn[disabled]{opacity:.45}
.field{width:100%;min-height:48px;padding:0 14px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-size:16px}
textarea.field{padding:12px 14px;min-height:76px;resize:vertical}
.field:focus{border-color:var(--buddy);outline:0}
label.lbl{font-size:13px;font-weight:700;color:var(--ink-2)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600}
.switch input{appearance:none;-webkit-appearance:none;width:52px;height:32px;border-radius:16px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch input:checked{background:var(--ok)}
.switch input:checked::after{transform:translateX(20px)}

/* ---- journal ---- */
.day{display:flex;align-items:baseline;gap:8px;padding:4px 4px 0}
.day b{font:800 18px var(--f-display)}
.stop{display:flex;gap:12px;text-align:left;width:100%;background:var(--card);border-radius:22px;padding:14px;align-items:flex-start}
.stop .n{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:800 15px var(--f-display);flex:none}
.stop.photo .n{background:var(--pop);color:var(--on-pop)}
.stop.shared .n{background:var(--buddy);color:var(--on-buddy)}
.stop .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.stop .nm{font-weight:800;font-size:17px;overflow-wrap:anywhere}
.stop .mt{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.thumbs{display:flex;gap:6px;margin-top:8px;overflow:hidden}
.thumbs img,.thumbs .more{width:60px;height:60px;border-radius:14px;object-fit:cover;flex:none}
.thumbs .more{display:grid;place-items:center;background:var(--fill);font:800 15px var(--f-display);color:var(--ink-2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.grid button{aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--fill)}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.empty{text-align:center;padding:28px 18px;color:var(--ink-2);display:flex;flex-direction:column;gap:14px;align-items:center}
.empty b{font:800 20px var(--f-display);color:var(--ink)}

/* ---- buddies ---- */
.code{font:800 34px var(--f-display);letter-spacing:.14em;font-variant-numeric:tabular-nums}
.buddy{display:flex;align-items:center;gap:12px}
.ava{width:44px;height:44px;border-radius:50%;background:var(--buddy);color:var(--on-buddy);display:grid;place-items:center;font:800 18px var(--f-display);flex:none}
.chat{display:flex;flex-direction:column;gap:6px;flex:1;overflow-y:auto;padding:4px 2px;min-height:160px}
.msg{max-width:80%;padding:9px 13px;border-radius:18px;background:var(--fill);align-self:flex-start;overflow-wrap:anywhere;font-size:15px}
.msg.me{align-self:flex-end;background:var(--buddy);color:var(--on-buddy)}
.msg.sys{align-self:center;background:none;color:var(--ink-2);font-size:13px;text-align:center}
.msg small{display:block;font-size:11px;opacity:.7;margin-top:2px}

/* ---- dialogs ---- */
dialog{border:0;padding:0;color:var(--ink);background:var(--bg);width:min(560px,100vw);max-width:100vw;max-height:92dvh;border-radius:28px 28px 0 0;margin:auto auto 0;overflow:hidden}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:rgba(8,9,20,.55)}
.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 8px}
.dlg-body{padding:8px 16px calc(var(--safe-b) + 18px);overflow-y:auto;display:flex;flex-direction:column;gap:14px;min-height:0}
#viewer{background:#000;color:#fff;width:100vw;height:100dvh;max-height:100dvh;border-radius:0;margin:0}
#viewer img{flex:1;min-height:0;width:100%;object-fit:contain}
.v-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px calc(var(--safe-b) + 12px);background:#101018}
.v-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(var(--safe-t) + 8px) 12px 8px;font-size:13px}
#viewer .btn{background:#262838;color:#fff}
#viewer select{min-height:42px;border-radius:999px;border:0;background:#262838;color:#fff;padding:0 12px;max-width:100%}
#chatDlg{height:92dvh}
#chatDlg .dlg-body{flex:1}
.toast{position:fixed;z-index:9999;inset:calc(var(--safe-t) + 66px) auto auto 50%;transform:translateX(-50%);margin:0;border:0;width:max-content;max-width:calc(100vw - 32px);padding:11px 18px;border-radius:22px;background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;box-shadow:var(--shadow)}

/* ---- map pins (tiles are light in both themes, so these use fixed colours) ---- */
.pin{width:34px;height:34px;border-radius:50%;background:#0E1020;color:#fff;display:grid;place-items:center;font:800 15px var(--f-display);border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.pin.shared{background:#3D5AFE}
.pin.pic{width:54px;height:54px;border-radius:18px;background-size:cover;background-position:center;transform:rotate(-5deg);position:relative;color:transparent}
.pin.pic i{position:absolute;right:-8px;top:-8px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:#FF3D81;color:#23040F;font:800 12px/22px var(--f-display);font-style:normal;text-align:center;border:2px solid #fff}
.me-dot{width:22px;height:22px;border-radius:50%;background:#FF3D81;border:4px solid #fff;box-shadow:0 0 0 0 rgba(255,61,129,.5);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 16px rgba(255,61,129,0)}100%{box-shadow:0 0 0 0 rgba(255,61,129,0)}}
.bud-pin{display:flex;flex-direction:column;align-items:center;gap:2px}
.bud-pin b{width:38px;height:38px;border-radius:50%;background:#3D5AFE;color:#fff;display:grid;place-items:center;font:800 16px var(--f-display);border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.bud-pin span{background:#0E1020;color:#fff;font:700 11px var(--f-body);padding:2px 7px;border-radius:9px;white-space:nowrap}
.bud-pin.stale b{background:#8A8FA8}
.leaflet-container{font:inherit}
.leaflet-top.leaflet-left{top:calc(var(--safe-t) + 60px)}
.leaflet-control-attribution{font-size:10px;border-radius:8px}
@media (prefers-color-scheme:dark){.leaflet-tile-pane{filter:brightness(.8) contrast(1.05)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- wide screens: panels become a left column, the map stays visible ---- */
@media (min-width:900px){
  #app{display:grid;grid-template-columns:420px 1fr}
  .side{order:-1;position:relative;border-right:1px solid var(--line);background:var(--bg);overflow:hidden}
  .stage{position:relative;inset:auto}
  .panel{padding-top:26px}
  #app[data-tab=map] #panel-journal{display:flex}
  .tabs{grid-template-columns:repeat(3,1fr)}
  .tab[data-tab=map]{display:none}
  #app[data-tab=map] .tab[data-tab=journal]{background:var(--ink);color:var(--bg)}
  .live{left:16px;right:auto;bottom:16px;width:440px}
  dialog{border-radius:28px;margin:auto}
}
</style>
</head>
<body>
<div id="app" data-tab="map">
  <div class="stage">
    <div id="map"></div>
    <div class="map-fail" id="mapFail" hidden><p data-i18n="mapFail"></p></div>
    <div class="top">
      <button class="pill" id="tripBtn"><svg class="i"><use href="#i-flag"/></svg><span id="tripName"></span></button>
      <div class="top-right">
        <button class="pill" id="buddyChip" hidden><span class="dot" id="buddyDot"></span><span id="buddyChipText"></span></button>
        <button class="pill round" id="recenter" data-i18n-aria="recenter"><svg class="i"><use href="#i-target"/></svg></button>
      </div>
    </div>
    <section class="live" id="liveCard">
      <div class="live-row">
        <div class="ring idle" id="ring"><div id="ringText">5:00</div></div>
        <div class="live-text"><strong id="liveTitle"></strong><span id="liveSub"></span></div>
        <button class="cta" id="trackBtn"></button>
      </div>
      <div class="live-actions">
        <div class="seg" role="group" data-i18n-aria="trackingMode">
          <button id="modeAlways" data-mode="always" data-i18n="modeAlways"></button>
          <button id="modeManual" data-mode="manual" data-i18n="modeManual"></button>
        </div>
        <span class="spacer"></span>
        <button class="chip" id="pinHere" data-i18n-aria="pinHere"><svg class="i"><use href="#i-pin"/></svg><span data-i18n="pinHere"></span></button>
        <button class="chip" id="addPhotos" data-i18n-aria="addPhotos"><svg class="i"><use href="#i-camera"/></svg><span data-i18n="photos"></span></button>
      </div>
    </section>
  </div>

  <aside class="side">
    <main class="panel" id="panel-journal">
      <div><h3 data-i18n="journal"></h3><h1 id="journalTitle"></h1></div>
      <div class="stats" id="stats"></div>
      <div class="row"><button class="btn pop" id="addPhotos2"><svg class="i"><use href="#i-camera"/></svg><span data-i18n="addPhotos"></span></button></div>
      <div id="timeline" style="display:flex;flex-direction:column;gap:10px"></div>
    </main>

    <main class="panel" id="panel-buddies">
      <div><h3 data-i18n="buddies"></h3><h1 data-i18n="buddiesTitle"></h1></div>
      <div class="card">
        <label class="lbl" for="myName" data-i18n="yourName"></label>
        <input class="field" id="myName" maxlength="24" autocomplete="nickname" data-i18n-ph="yourNamePh">
        <label class="switch"><span data-i18n="buddyOn"></span><input type="checkbox" id="shareOn"></label>
        <p class="muted" id="netStatus"></p>
      </div>
      <div class="card" id="codeCard" hidden>
        <h3 data-i18n="yourCode"></h3>
        <div class="code" id="myCode"></div>
        <p class="muted" data-i18n="codeHelp"></p>
        <div class="row"><button class="btn pri" id="shareInvite"><svg class="i"><use href="#i-send"/></svg><span data-i18n="sendInvite"></span></button></div>
        <h3 data-i18n="addBuddy" style="margin-top:6px"></h3>
        <form class="row" id="addBuddyForm">
          <input class="field grow" id="buddyCode" maxlength="7" autocapitalize="characters" autocomplete="off" spellcheck="false" data-i18n-ph="buddyCodePh" style="width:auto;letter-spacing:.12em;font-weight:800">
          <button class="btn pop" data-i18n="connect"></button>
        </form>
        <label class="switch"><span data-i18n="shareLive"></span><input type="checkbox" id="shareLive"></label>
      </div>
      <div id="buddyList" style="display:flex;flex-direction:column;gap:10px"></div>
      <p class="muted" data-i18n="p2pNote"></p>
    </main>

    <main class="panel" id="panel-me">
      <div><h3 data-i18n="me"></h3><h1 data-i18n="settings"></h1></div>
      <div class="card">
        <h3 data-i18n="trips"></h3>
        <div id="tripList" style="display:flex;flex-direction:column;gap:8px"></div>
        <form class="row" id="newTripForm">
          <input class="field grow" id="newTripName" maxlength="40" data-i18n-ph="newTripPh" style="width:auto">
          <button class="btn pri" data-i18n="create"></button>
        </form>
      </div>
      <div class="card" id="curTripCard">
        <h3 data-i18n="thisTrip"></h3>
        <input class="field" id="tripRename" maxlength="40" data-i18n-aria="tripNameLabel">
        <div class="row">
          <button class="btn sm" id="exportBtn" data-i18n="export"></button>
          <button class="btn sm" id="importBtn" data-i18n="import"></button>
          <button class="btn sm danger" id="deleteTrip" data-i18n="deleteTrip"></button>
        </div>
        <p class="muted" data-i18n="exportNote"></p>
      </div>
      <div class="card">
        <h3 data-i18n="tracking"></h3>
        <label class="switch"><span data-i18n="keepAwake"></span><input type="checkbox" id="keepAwake"></label>
        <p class="muted" data-i18n="trackNote"></p>
      </div>
      <div class="card">
        <label class="lbl" for="langSel" data-i18n="language"></label>

<dialog id="placeDlg">
  <div class="dlg-head"><h2 id="placeHead"></h2><button class="btn sm" data-close data-i18n="done"></button></div>
  <div class="dlg-body">
    <input class="field" id="placeName" maxlength="60" data-i18n-ph="placeNamePh" data-i18n-aria="placeNamePh">
    <div class="muted" id="placeVisits"></div>
    <textarea class="field" id="placeNote" maxlength="600" data-i18n-ph="notePh" data-i18n-aria="notePh"></textarea>
    <div class="grid" id="placePhotos"></div>
    <div class="row">
      <button class="btn pop" id="placeAdd"><svg class="i"><use href="#i-camera"/></svg><span data-i18n="addHere"></span></button>
      <button class="btn" id="placeSend"><svg class="i"><use href="#i-send"/></svg><span data-i18n="sendBuddy"></span></button>
      <a class="btn" id="placeGmaps" target="_blank" rel="noopener"><svg class="i"><use href="#i-ext"/></svg><span data-i18n="openGmaps"></span></a>
    </div>
    <div class="row"><button class="btn sm danger" id="placeDelete" data-i18n="deleteStop"></button></div>
  </div>
</dialog>

<dialog id="viewer">
  <div class="v-top"><span id="vCaption"></span><button class="btn sm" data-close data-i18n="close"></button></div>
  <img id="vImg" alt="">
  <div class="v-bar">
    <button class="btn sm" id="vPrev" data-i18n-aria="prev">‹</button>
    <button class="btn sm" id="vNext" data-i18n-aria="next">›</button>
    <select id="vMove" data-i18n-aria="moveTo"></select>
    <span class="spacer"></span>
    <button class="btn sm" id="vSend"><svg class="i"><use href="#i-send"/></svg></button>
    <button class="btn sm" id="vDelete" data-i18n="delete"></button>
  </div>
</dialog>

<dialog id="chatDlg">
  <div class="dlg-head"><h2 id="chatHead"></h2><button class="btn sm" data-close data-i18n="close"></button></div>
  <div class="dlg-body">
    <div class="chat" id="chatLog"></div>
    <form class="row" id="chatForm">
      <input class="field grow" id="chatInput" maxlength="500" autocomplete="off" data-i18n-ph="messagePh" style="width:auto">
      <button class="btn pop" data-i18n-aria="send"><svg class="i"><use href="#i-send"/></svg></button>
    </form>
  </div>
</dialog>

<dialog id="askDlg">
  <div class="dlg-head"><h2 id="askHead"></h2></div>
  <div class="dlg-body">
    <p class="muted" id="askText"></p>
    <div class="row"><button class="btn pop" id="askYes"></button><button class="btn" id="askNo"></button></div>
  </div>
</dialog>

<input type="file" id="filePick" accept="image/*" multiple hidden>
<input type="file" id="importPick" accept=".json,application/json" hidden>

const $ = (s, r = document) => r.querySelector(s);

function dist(a, b) {            // metres between two {lat,lng}
  const R = 6371000, p = Math.PI / 180, dLat = (b.lat - a.lat) * p, dLng = (b.lng - a.lng) * p;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * p) * Math.cos(b.lat * p) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const F = {
  time: ms => new Intl.DateTimeFormat(LOCALE[LANG], { hour: 'numeric', minute: '2-digit' }).format(ms),
  day: ms => new Intl.DateTimeFormat(LOCALE[LANG], { weekday: 'short', month: 'short', day: 'numeric' }).format(ms),
  dur: ms => { const m = Math.max(1, Math.round(ms / 60000)); return m < 60 ? t('min', { n: m }) : t('hr', { h: Math.floor(m / 60), m: m % 60 }); },
  clock: ms => { const s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); },
  m: d => d < 1000 ? Math.max(10, Math.round(d / 10) * 10) + ' m' : (d / 1000).toFixed(1) + ' km',

};

/* ---------- Storage (IndexedDB, on this device only) ---------- */
const DB = (() => {
  let p;
  const open = () => p ??= new Promise((res, rej) => {
    const r = indexedDB.open('trip-trail', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('trips', { keyPath: 'id' });
      d.createObjectStore('points', { keyPath: 'id', autoIncrement: true }).createIndex('trip', 'tripId');
      d.createObjectStore('places', { keyPath: 'id' }).createIndex('trip', 'tripId');
      d.createObjectStore('photos', { keyPath: 'id' }).createIndex('trip', 'tripId');
      d.createObjectStore('chat', { keyPath: 'id' }).createIndex('buddy', 'buddy');
      d.createObjectStore('files');   // full-size photos, keyed by photo id
      d.createObjectStore('meta');
    };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const run = async (stores, mode, fn) => {
    const d = await open();
    return new Promise((res, rej) => {
      const tx = d.transaction(stores, mode); let out;
      tx.oncomplete = () => res(out ? out.result : undefined);
      tx.onerror = tx.onabort = () => rej(tx.error);
      out = fn(tx);
    });
  };
  return {
    get: (s, k) => run(s, 'readonly', tx => tx.objectStore(s).get(k)),
    all: s => run(s, 'readonly', tx => tx.objectStore(s).getAll()),
    by: (s, idx, k) => run(s, 'readonly', tx => tx.objectStore(s).index(idx).getAll(k)),
    put: (s, v, k) => run(s, 'readwrite', tx => { tx.objectStore(s).put(v, k); }),
    del: (s, k) => run(s, 'readwrite', tx => { tx.objectStore(s).delete(k); }),
    delBy: (s, idx, k) => run(s, 'readwrite', tx => {
      const st = tx.objectStore(s), r = st.index(idx).openKeyCursor(IDBKeyRange.only(k));
      r.onsuccess = () => { const c = r.result; if (c) { st.delete(c.primaryKey); c.continue(); } };
    })
  };
})();

}

  for (let i = 1; i < S.points.length; i++) {
    const a = S.points[i - 1], b = S.points[i], s = dist(a, b);

}

/* ---------- Trips ---------- */
async function createTrip(name) {
  const tr = { id: uid(), name: (name || '').trim() || t('tripDefault'), created: Date.now() };
  await DB.put('trips', tr); S.trips.push(tr); await loadTrip(tr.id); return tr;
}
async function ensureTrip() { if (!S.trip) await createTrip(); return S.trip; }
async function loadTrip(id) {
  S.trip = S.trips.find(x => x.id === id) || null;
  for (const k of [...thumbs.keys()]) dropThumb(k);
  if (S.trip) {
    [S.places, S.points, S.photos] = await Promise.all([DB.by('places', 'trip', id), DB.by('points', 'trip', id), DB.by('photos', 'trip', id)]);
    S.points.sort((a, b) => a.t - b.t);
  } else { S.places = []; S.points = []; S.photos = []; }
  if (CFG.currentTrip !== id) { CFG.currentTrip = id; CFG.cand = null; saveCfg(); }
  renderAll(); renderMe(); fitTrip();
  S.places.forEach(queueGeocode);
}
async function deleteTrip(id) {
  const photos = await DB.by('photos', 'trip', id);
  for (const ph of photos) await DB.del('files', ph.id);
  for (const s of ['points', 'places', 'photos']) await DB.delBy(s, 'trip', id);
  await DB.del('trips', id);
  S.trips = S.trips.filter(x => x.id !== id);
  await loadTrip(S.trips[0] ? S.trips[0].id : null);
}

function drawRoute() {
  if (!map) return;
  const solid = [], gaps = []; let cur = [];
  for (let i = 0; i < S.points.length; i++) {
    const p = S.points[i], q = S.points[i - 1];
    if (q && p.t - q.t > GAP_MS && dist(p, q) > GAP_M) { if (cur.length > 1) solid.push(cur); gaps.push([[q.lat, q.lng], [p.lat, p.lng]]); cur = []; }
    cur.push([p.lat, p.lng]);
  }
  if (cur.length > 1) solid.push(cur);
  layers.route.setLatLngs(solid); layers.gaps.setLatLngs(gaps);
}

/* ---------- Travel buddies: phone-to-phone over WebRTC (PeerJS) ----------
   Each phone has a 6-character code. One side dials the other's code; after that both reconnect
   automatically whenever both have the app open. Messages are small JSON objects; photos are sent
   in pieces. Nothing is stored on a server. */
const CODE_ABC = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const PID = code => 'triptrail-v1-' + code;
const newCode = () => [...crypto.getRandomValues(new Uint8Array(6))].map(x => CODE_ABC[x % 32]).join('');

function loadPeerLib() {

}
const Share = {
  peer: null, opened: false, state: 'off', conns: new Map(), live: new Map(), unread: {}, lastSent: 0,
  dialing: new Set(), rx: new Map(), rxQ: Promise.resolve(), asks: [], asking: null,

  liveCount() { let n = 0; for (const v of this.live.values()) if (Date.now() - v.t < 60000) n++; return n; },
  wantsLoc() { return CFG.shareOn && CFG.shareLive && this.conns.size > 0; },
  setState(s) { this.state = s; renderBuddies(); renderTop(); },

  async start() {
    if (this.peer || !CFG.shareOn) return;
    if (!CFG.code) { CFG.code = newCode(); saveCfg(); }
    this.setState('connecting');
    try { await loadPeerLib(); } catch (e) { this.setState('error'); return; }
    if (this.peer || !CFG.shareOn) return;
    const peer = this.peer = new Peer(PID(CFG.code), { debug: 0 });
    this.opened = false;
    peer.on('open', () => { if (this.peer !== peer) return; this.opened = true; this.setState('ready'); this.dialAll(); });
    peer.on('connection', c => this.onIncoming(c));
    peer.on('disconnected', () => { if (this.peer === peer) this.setState('connecting'); });
    peer.on('error', e => {
      const ty = e && e.type;

      this.setState(ty === 'unavailable-id' ? 'taken' : 'error');
    });
  },
  stop() {
    for (const c of this.conns.values()) try { c.close(); } catch (e) {}
    this.conns.clear(); this.live.clear(); this.dialing.clear();
    const p = this.peer; this.peer = null; if (p) try { p.destroy(); } catch (e) {}
    this.setState('off'); drawBuddies(); syncWatch();
  },
  tick() {                       // runs every 20 s and when the app comes back to the front
    if (!CFG.shareOn) return;
    const p = this.peer;
    if (!p) return void this.start();
    if (p.destroyed || (p.disconnected && !this.opened)) { this.peer = null; try { p.destroy(); } catch (e) {} return void this.start(); }
    if (p.disconnected) { try { p.reconnect(); } catch (e) { this.peer = null; this.start(); } return; }
    if (p.open) { if (this.state !== 'ready') this.setState('ready'); this.dialAll(); }
  },
  dialAll() { for (const b of CFG.buddies) if (!this.isOpen(b.code)) this.dial(b.code); },
  isOpen(code) { const c = this.conns.get(code); return !!(c && c.open); },
  dial(code) {
    if (!this.peer || !this.peer.open || this.dialing.has(code)) return;
    this.dialing.add(code);
    const c = this.peer.connect(PID(code), { reliable: true, serialization: 'json', metadata: { code: CFG.code, name: CFG.name } });
    if (!c) { this.dialing.delete(code); return; }
    c._ok = true;
    this.wire(c, code, true);
    setTimeout(() => { this.dialing.delete(code); if (!c.open) try { c.close(); } catch (e) {} }, 15000);
  },
  onIncoming(c) {
    const md = c.metadata || {}, code = clip(md.code, 6);
    if (c.peer !== PID(code) || code === CFG.code) { c.close(); return; }
    c._buf = []; c._ok = !!buddy(code);
    c.on('data', d => { if (c._ok) this.onData(code, d); else if (c._buf.length < 50) c._buf.push(d); });
    if (c._ok) return this.wire(c, code, false);
    this.asks.push({ c, code, name: clip(md.name, 24) || t('buddy') }); this.nextAsk();   // a stranger: ask first
  },
  nextAsk() {
    if (this.asking || !this.asks.length) return;
    const a = this.asking = this.asks.shift();
    $('#askHead').textContent = t('wantsToJoin', { name: a.name }); $('#askText').textContent = t('wantsText');
    $('#askYes').textContent = t('accept'); $('#askNo').textContent = t('decline');
    $('#askDlg').showModal();
  },
  answer(yes) {
    const a = this.asking; this.asking = null; $('#askDlg').close(); if (!a) return;
    if (yes) {
      if (!buddy(a.code)) { CFG.buddies.push({ code: a.code, name: a.name, seen: Date.now() }); saveCfg(); }
      a.c._ok = true; this.wire(a.c, a.code, false);
      for (const d of a.c._buf) this.onData(a.code, d); a.c._buf = [];
    } else try { a.c.close(); } catch (e) {}
    this.nextAsk();
  },
  wire(c, code, outgoing) {
    c._out = outgoing;
    const opened = () => {
      const ex = this.conns.get(code);
      if (ex && ex !== c && ex.open) {          // both phones dialled at once: keep the call placed by the smaller code
        const mine = outgoing ? CFG.code : code, theirs = ex._out ? CFG.code : code;
        if (!(mine < theirs)) { c._dup = true; try { c.close(); } catch (e) {} return; }
        ex._dup = true; try { ex.close(); } catch (e) {}
      }
      const first = !ex || !ex.open;
      this.conns.set(code, c); this.dialing.delete(code);
      this.send(code, { k: 'hello', name: CFG.name });
      flushChat(code);
      if (S.lastFix && Date.now() - S.lastFixAt < 120000) this.sendLoc(S.lastFix, true);
      const b = buddy(code);
      if (first && b) toast(t('buddyConnected', { name: b.name }));
      renderBuddies(); renderTop(); syncWatch();
    };
    if (c.open) opened(); else c.on('open', opened);
    if (outgoing) c.on('data', d => this.onData(code, d));
    c.on('close', () => {

    });

  },
  send(code, msg) { const c = this.conns.get(code); if (c && c.open) { try { c.send(msg); return true; } catch (e) {} } return false; },
  sendLoc(f, force) {
    if (!CFG.shareLive || !this.conns.size) return;
    const now = Date.now(); if (!force && now - this.lastSent < 2000) return;   // at most one update every 2 s
    this.lastSent = now;
    for (const code of this.conns.keys()) this.send(code, { k: 'loc', lat: f.lat, lng: f.lng, acc: f.acc });
  },
  onData(code, d) {
    const b = buddy(code); if (!b || !d || typeof d !== 'object') return;
    if (d.k === 'hello') { const nm = clip(d.name, 24).trim(); if (nm && nm !== b.name) { b.name = nm; saveCfg(); } renderBuddies(); drawBuddies(); }
    else if (d.k === 'loc') { if (isNum(d.lat) && isNum(d.lng) && Math.abs(d.lat) <= 90 && Math.abs(d.lng) <= 180) { this.live.set(code, { lat: d.lat, lng: d.lng, acc: +d.acc || 0, t: Date.now() }); drawBuddies(); renderBuddiesSoon(); renderTop(); } }
    else if (d.k === 'locoff') { this.live.delete(code); drawBuddies(); renderBuddies(); renderTop(); }
    else if (d.k === 'chat') { saveChat({ id: clip(d.id, 40), buddy: code, from: 'them', text: clip(d.text, 500), t: +d.t || Date.now() }); this.send(code, { k: 'ack', id: d.id }); }

  },
  findSid(sid) { return sid ? S.places.find(p => p.sid === sid || p.id === sid) : null; },
  async onPlace(b, d) {
    if (!isNum(d.lat) || !isNum(d.lng)) return;
    await ensureTrip();
    const sid = clip(d.sid, 40), name = clip(d.name, 60);
    let p = this.findSid(sid) || nearestPlace(d, STAY_R);
    if (!p) {
      const visits = (Array.isArray(d.visits) ? d.visits : []).filter(v => v && isNum(v.arrive) && isNum(v.depart)).slice(0, 20).map(v => ({ arrive: v.arrive, depart: v.depart }));
      p = { id: uid(), tripId: S.trip.id, kind: 'shared', sid, from: b.name, lat: d.lat, lng: d.lng, name, area: clip(d.area, 60), note: clip(d.note, 600), geoDone: true,
        visits: visits.length ? visits : [{ arrive: Date.now(), depart: Date.now() }] };

    } else if (!p.sid) p.sid = sid;

  },
  async onFile(b, d) {
    const key = b.code + ':' + clip(d.id, 40), n = d.n | 0, i = d.i | 0;

    if (!r) { if (i !== 0) return; r = { parts: [], meta: d.meta && typeof d.meta === 'object' ? d.meta : {} }; this.rx.set(key, r); }

    renderAll(); if (curPlace && $('#placeDlg').open) openPlace(curPlace);
    if (!pl) { logSys(b.code, t('gotPhoto', { who: b.name })); toast(t('gotPhoto', { who: b.name })); }
  },
  async sendPhotoTo(code, ph, sid) {

    const u = new Uint8Array(await blob.arrayBuffer()); let bin = '';
    for (let i = 0; i < u.length; i += 8192) bin += String.fromCharCode.apply(null, u.subarray(i, i + 8192));
    const b64 = btoa(bin), CH = 12000, n = Math.ceil(b64.length / CH), id = uid();
    for (let i = 0; i < n; i++) {
      const c = this.conns.get(code); if (!c || !c.open) return;
      const msg = { k: 'file', id, i, n, d: b64.slice(i * CH, (i + 1) * CH) };
      if (i === 0) msg.meta = { t: ph.t, lat: ph.lat, lng: ph.lng, sid: sid || null };

  },
  async sendPlace(id) {
    const codes = [...this.conns.keys()], p = S.places.find(x => x.id === id);

    const photos = S.photos.filter(x => x.placeId === id), sid = p.sid || p.id, name = placeLabel(p);
    toast(t('sentPlace', { name }));
    for (const code of codes) {
      this.send(code, { k: 'place', sid, name, area: p.area || '', lat: p.lat, lng: p.lng, visits: p.visits, note: p.note || '' });
      for (const ph of photos) await this.sendPhotoTo(code, ph, sid);
      logSys(code, t('sentPlace', { name }));
    }
  },
  async sendPhoto(id) {
    const codes = [...this.conns.keys()], ph = S.photos.find(x => x.id === id);
    if (!codes.length || !ph) { toast(t('notConnected')); return; }
    const pl = S.places.find(p => p.id === ph.placeId);
    for (const code of codes) { await this.sendPhotoTo(code, ph, pl ? pl.sid || null : null); logSys(code, t('sentPhoto')); }
    toast(t('sentPhoto'));
  }
};
function drawBuddies() {

    const b = buddy(code); if (!b) continue;
    const stale = Date.now() - v.t > 60000;
    const html = `<div class="bud-pin ${stale ? 'stale' : ''}"><b>${esc((b.name || '?').trim().charAt(0).toUpperCase())}</b><span>${esc(b.name)}</span></div>`;
    layers.buddies.addLayer(L.marker([v.lat, v.lng], { icon: L.divIcon({ className: '', html, iconSize: [90, 62], iconAnchor: [45, 22] }), zIndexOffset: 800, interactive: false }));
  }
}
let budTimer;
const renderBuddiesSoon = () => { if (!budTimer) budTimer = setTimeout(() => { budTimer = 0; renderBuddies(); }, 3000); };

    if (on && live && S.lastFix) st += ' · ' + t('away', { d: F.m(dist(live, S.lastFix)) });
    const un = Share.unread[b.code];

      <div class="grow" style="min-width:0"><b>${esc(b.name)}</b><div class="muted"><span class="dot ${on ? 'on' : ''}" style="display:inline-block;margin-right:6px"></span>${esc(st)}</div></div></div>
      <div class="row"><button class="btn sm pri" data-chat="${esc(b.code)}">${esc(t('chat'))}${un ? ' (' + un + ')' : ''}</button>
      <button class="btn sm" data-find="${esc(b.code)}"${live ? '' : ' disabled'}>${esc(t('find'))}</button>

  }).join('') || (CFG.shareOn ? `<div class="empty"><span>${esc(t('noBuddies'))}</span></div>` : '');
}

/* ---------- Chat ---------- */
let chatWith = null;
function msgHTML(m) {
  if (m.from === 'sys') return `<div class="msg sys">${esc(m.text)}</div>`;
  return `<div class="msg ${m.from === 'me' ? 'me' : ''}" data-id="${esc(m.id)}">${esc(m.text)}<small>${esc(F.time(m.t))}${m.from === 'me' && !m.sent ? ' · ' + esc(t('queued')) : ''}</small></div>`;
}
async function openChat(code) {
  const b = buddy(code); if (!b) return;
  chatWith = code; delete Share.unread[code]; renderTop(); renderBuddies();
  $('#chatHead').textContent = b.name;
  const all = (await DB.by('chat', 'buddy', code)).sort((a, b) => a.t - b.t);
  const log = $('#chatLog'); log.innerHTML = all.map(msgHTML).join('');
  if (!$('#chatDlg').open) $('#chatDlg').showModal();
  log.scrollTop = log.scrollHeight;
}
async function saveChat(m) {
  await DB.put('chat', m).catch(() => {});
  if (chatWith === m.buddy && $('#chatDlg').open) { const log = $('#chatLog'); log.insertAdjacentHTML('beforeend', msgHTML(m)); log.scrollTop = log.scrollHeight; }
  else if (m.from === 'them') { Share.unread[m.buddy] = (Share.unread[m.buddy] || 0) + 1; renderTop(); renderBuddies(); const b = buddy(m.buddy); toast((b ? b.name : '') + ': ' + m.text, 4000); }
}
const logSys = (code, text) => saveChat({ id: uid(), buddy: code, from: 'sys', text, t: Date.now() });
function sendChat(code, text) {
  const m = { id: uid(), buddy: code, from: 'me', text, t: Date.now(), sent: false };
  saveChat(m); Share.send(code, { k: 'chat', id: m.id, text, t: m.t });
}
async function flushChat(code) {   // deliver anything typed while the buddy was away
  const all = await DB.by('chat', 'buddy', code).catch(() => []);
  for (const m of all.sort((a, b) => a.t - b.t)) if (m.from === 'me' && !m.sent) Share.send(code, { k: 'chat', id: m.id, text: m.text, t: m.t });
}
async function markSent(id) {
  const m = await DB.get('chat', id).catch(() => null); if (!m || m.sent) return;
  m.sent = true; await DB.put('chat', m);
  const el = document.querySelector(`.msg[data-id="${CSS.escape(id)}"] small`); if (el) el.textContent = F.time(m.t);
}

/* ---------- Me: trips, settings, export ---------- */
function renderMe() {
  $('#tripList').innerHTML = S.trips.map(x => `<button class="btn ${S.trip && x.id === S.trip.id ? 'pri' : ''}" data-trip="${esc(x.id)}" style="justify-content:flex-start">${esc(x.name)}</button>`).join('');
  $('#curTripCard').hidden = !S.trip;
  if (S.trip && document.activeElement !== $('#tripRename')) $('#tripRename').value = S.trip.name;
  $('#keepAwake').checked = CFG.keepAwake; $('#langSel').value = LANG;
}
function exportTrip() {
  if (!S.trip) return;
  const data = { app: 'trip-trail', v: 1, trip: S.trip, places: S.places, points: S.points.map(p => [p.t, +p.lat.toFixed(6), +p.lng.toFixed(6)]) };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));
  a.download = (S.trip.name.replace(/[\\/:*?"<>|]+/g, '').trim() || 'trip') + '.json';
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 15000);
}
async function importTrip(file) {
  try {
    const d = JSON.parse(await file.text());
    if (!d || d.app !== 'trip-trail' || !Array.isArray(d.places) || !Array.isArray(d.points)) throw 0;
    const tr = { id: uid(), name: clip(d.trip && d.trip.name, 40) || t('tripDefault'), created: Date.now() };
    await DB.put('trips', tr); S.trips.push(tr);
    for (const p of d.places) {
      if (!isNum(p.lat) || !isNum(p.lng)) continue;
      const visits = (Array.isArray(p.visits) ? p.visits : []).filter(v => v && isNum(v.arrive) && isNum(v.depart)).map(v => ({ arrive: v.arrive, depart: v.depart }));
      await DB.put('places', { id: uid(), tripId: tr.id, kind: ['stay', 'photo', 'shared'].includes(p.kind) ? p.kind : 'stay', lat: p.lat, lng: p.lng, name: clip(p.name, 60), area: clip(p.area, 60), note: clip(p.note, 600), geoDone: true, visits: visits.length ? visits : [{ arrive: Date.now(), depart: Date.now() }] });
    }
    for (const q of d.points) if (Array.isArray(q) && isNum(q[0]) && isNum(q[1]) && isNum(q[2])) await DB.put('points', { tripId: tr.id, t: q[0], lat: q[1], lng: q[2] });
    await loadTrip(tr.id); toast(t('imported'));
  } catch (e) { toast(t('importFail')); }
}
async function loadSample() {    // a made-up day so the app can be explored before a real trip
  const tr = await createTrip(t('sampleName'));
  const d0 = new Date(); d0.setDate(d0.getDate() - 1); d0.setHours(9, 30, 0, 0);
  const at = (h, m) => new Date(d0).setHours(h, m, 0, 0);
  const stops = [
    ['Pastéis de Belém', 38.69750, -9.20320, at(9, 40), at(10, 15), 2, 28],
    ['Torre de Belém', 38.69158, -9.21597, at(10, 40), at(11, 20), 1, 200],
    ['Time Out Market', 38.70700, -9.14590, at(12, 30), at(13, 40), 2, 12],
    ['Miradouro de Santa Luzia', 38.71170, -9.13010, at(14, 30), at(15, 0), 1, 320],
    ['Castelo de S. Jorge', 38.71390, -9.13350, at(15, 20), at(16, 30), 2, 265]
  ];
  let prev = null;
  for (const [name, lat, lng, arrive, depart, nPh, hue] of stops) {
    if (prev) for (let i = 1; i <= 14; i++) {
      const k = i / 15, wob = Math.sin(k * Math.PI) * .0022;
      const p = { tripId: tr.id, t: prev.depart + (arrive - prev.depart) * k, lat: prev.lat + (lat - prev.lat) * k + wob, lng: prev.lng + (lng - prev.lng) * k + wob * .6 };
      S.points.push(p); await DB.put('points', p);
    }
    const here = { tripId: tr.id, t: arrive, lat, lng }; S.points.push(here); await DB.put('points', here);
    const pl = { id: uid(), tripId: tr.id, kind: 'stay', lat, lng, name, area: 'Lisboa', note: '', geoDone: true, visits: [{ arrive, depart }] };
    S.places.push(pl); await DB.put('places', pl);
    for (let i = 0; i < nPh; i++) {
      const c = document.createElement('canvas'); c.width = 1200; c.height = 900;
      const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 1200, 900);
      gr.addColorStop(0, `hsl(${hue + i * 25} 85% 62%)`); gr.addColorStop(1, `hsl(${hue + 70 + i * 25} 80% 42%)`);
      g.fillStyle = gr; g.fillRect(0, 0, 1200, 900);
      g.fillStyle = 'rgba(255,255,255,.92)'; g.font = '800 64px system-ui,sans-serif'; g.fillText(name, 60, 800);
      g.font = '600 34px system-ui,sans-serif'; g.fillText('Sample photo', 60, 850);
      const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .8));
      await storePhoto(blob, { t: arrive + (i + 1) * 9 * 60000, lat, lng }, { placeId: pl.id, by: 'location' });
    }
    prev = { lat, lng, depart };
  }
  renderAll(); renderMe(); fitTrip(); toast(t('sampleLoaded'));
}

/* ---------- Wiring ---------- */
function setTab(name) {
  $('#app').dataset.tab = name;
  $$('.tab').forEach(b => b.dataset.tab === name ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  if (name === 'map' && map) setTimeout(() => map.invalidateSize(), 50);
  if (name === 'buddies') renderBuddies();
  if (name === 'me') renderMe();
}
function pickPhotos(placeId) { pickFor = placeId || null; const f = $('#filePick'); f.value = ''; f.click(); }
function bind() {
  $$('.tab').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
  $('#tripBtn').addEventListener('click', () => setTab('me'));
  $('#buddyChip').addEventListener('click', () => setTab('buddies'));
  $('#trackBtn').addEventListener('click', () => S.tracking ? stopTracking() : startTracking());
  for (const b of [$('#modeAlways'), $('#modeManual')]) b.addEventListener('click', () => {
    CFG.mode = b.dataset.mode; saveCfg();
    if (CFG.mode === 'always' && !S.tracking) startTracking(); else { S.paused = false; renderLive(); }
  });
  $('#recenter').addEventListener('click', () => {
    S.follow = true; $('#recenter').classList.add('on');
    if (S.lastFix && map) map.setView([S.lastFix.lat, S.lastFix.lng], Math.max(map.getZoom(), 16));
    if ('geolocation' in navigator) navigator.geolocation.getCurrentPosition(onPos, onGeoErr, { enableHighAccuracy: true, timeout: 15000, maximumAge: 10000 });
  });
  $('#pinHere').addEventListener('click', pinHere);
  $('#addPhotos').addEventListener('click', () => pickPhotos());
  $('#addPhotos2').addEventListener('click', () => pickPhotos());
  $('#filePick').addEventListener('change', e => importPhotos([...e.target.files], pickFor));
  $('#timeline').addEventListener('click', e => {
    const s = e.target.closest('[data-place]'); if (s) return openPlace(s.dataset.place);
    const l = e.target.closest('[data-loose]'); if (l) openViewer($('#timeline')._loose, +l.dataset.loose);
  });
  // dialogs: Close buttons, and tapping the dimmed backdrop
  $$('dialog').forEach(d => {
    d.addEventListener('click', e => { if (e.target === d && d.id !== 'askDlg') d.close(); });
    $$('[data-close]', d).forEach(b => b.addEventListener('click', () => d.close()));
  });
  $('#askDlg').addEventListener('cancel', e => e.preventDefault());
  $('#placeName').addEventListener('change', savePlaceFields); $('#placeNote').addEventListener('change', savePlaceFields);
  $('#placeDlg').addEventListener('close', () => { curPlace = null; });
  $('#placePhotos').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) openViewer($('#placePhotos')._ids, +b.dataset.i); });
  $('#placeAdd').addEventListener('click', () => pickPhotos(curPlace));
  $('#placeSend').addEventListener('click', () => Share.sendPlace(curPlace));
  confirmTap($('#placeDelete'), async () => { const id = curPlace; $('#placeDlg').close(); await deletePlace(id); });
  $('#vPrev').addEventListener('click', () => { if (V.i > 0) { V.i--; showPhoto(); } });
  $('#vNext').addEventListener('click', () => { if (V.i < V.ids.length - 1) { V.i++; showPhoto(); } });
  $('#vMove').addEventListener('change', async e => {
    const ph = S.photos.find(p => p.id === V.ids[V.i]); if (!ph) return;
    ph.placeId = e.target.value || null; ph.by = ph.placeId ? 'manual' : null; await DB.put('photos', ph);
    renderAll(); if (curPlace) openPlace(curPlace); showPhoto();
  });
  $('#vSend').addEventListener('click', () => Share.sendPhoto(V.ids[V.i]));
  confirmTap($('#vDelete'), async () => {
    await deletePhoto(V.ids[V.i]); V.ids.splice(V.i, 1); V.i = Math.min(V.i, V.ids.length - 1);
    renderAll(); if (curPlace && S.places.some(p => p.id === curPlace)) openPlace(curPlace); else if (curPlace) $('#placeDlg').close();
    if (V.ids.length) showPhoto(); else $('#viewer').close();
  });
  $('#viewer').addEventListener('close', () => { if (V.url) { URL.revokeObjectURL(V.url); V.url = null; } $('#vImg').removeAttribute('src'); });
  // buddies
  $('#myName').addEventListener('change', e => { CFG.name = e.target.value.trim().slice(0, 24); saveCfg(); for (const code of Share.conns.keys()) Share.send(code, { k: 'hello', name: CFG.name }); });
  $('#shareOn').addEventListener('change', e => {
    if (e.target.checked && !CFG.name) { e.target.checked = false; toast(t('nameFirst')); $('#myName').focus(); return; }
    CFG.shareOn = e.target.checked; saveCfg(); CFG.shareOn ? Share.start() : Share.stop();
  });
  $('#shareLive').addEventListener('change', e => {
    CFG.shareLive = e.target.checked; saveCfg();
    if (!CFG.shareLive) for (const code of Share.conns.keys()) Share.send(code, { k: 'locoff' });
    else if (S.lastFix) Share.sendLoc(S.lastFix, true);
    syncWatch();
  });
  $('#shareInvite').addEventListener('click', async () => {
    const text = t('inviteText', { url: location.origin + location.pathname, code: CFG.code });
    try { if (navigator.share) { await navigator.share({ text }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(text); toast(t('copied')); } catch (e) { toast(CFG.code); }
  });
  $('#addBuddyForm').addEventListener('submit', e => {
    e.preventDefault();
    const code = $('#buddyCode').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length !== 6 || [...code].some(ch => !CODE_ABC.includes(ch)) || code === CFG.code) { toast(t('badCode')); return; }
    if (!buddy(code)) { CFG.buddies.push({ code, name: t('buddy') + ' ' + code, seen: 0 }); saveCfg(); }
    $('#buddyCode').value = ''; toast(t('connectingTo', { code })); renderBuddies(); renderTop(); Share.tick(); Share.dial(code);
  });
  $('#buddyList').addEventListener('click', e => {
    const c = e.target.closest('[data-chat]'); if (c) return openChat(c.dataset.chat);
    const f = e.target.closest('[data-find]');
    if (f) { const v = Share.live.get(f.dataset.find); if (v && map) { S.follow = false; setTab('map'); map.setView([v.lat, v.lng], Math.max(map.getZoom(), 16)); } return; }
    const r = e.target.closest('[data-remove]');
    if (r) {
      if (!r.dataset.armed) { r.dataset.armed = '1'; r.textContent = t('confirmDelete'); return; }
      const code = r.dataset.remove, conn = Share.conns.get(code);
      CFG.buddies = CFG.buddies.filter(b => b.code !== code); saveCfg();
      if (conn) try { conn.close(); } catch (err) {}
      Share.conns.delete(code); Share.live.delete(code); DB.delBy('chat', 'buddy', code).catch(() => {});
      renderBuddies(); renderTop(); drawBuddies();
    }
  });
  $('#chatForm').addEventListener('submit', e => { e.preventDefault(); const v = $('#chatInput').value.trim(); if (!v || !chatWith) return; $('#chatInput').value = ''; sendChat(chatWith, v); });
  $('#chatDlg').addEventListener('close', () => { chatWith = null; });
  $('#askYes').addEventListener('click', () => Share.answer(true));
  $('#askNo').addEventListener('click', () => Share.answer(false));
  // me
  $('#tripList').addEventListener('click', e => { const b = e.target.closest('[data-trip]'); if (b) loadTrip(b.dataset.trip); });
  $('#newTripForm').addEventListener('submit', async e => { e.preventDefault(); const v = $('#newTripName').value; $('#newTripName').value = ''; await createTrip(v); setTab('map'); });
  $('#tripRename').addEventListener('change', async e => { if (!S.trip) return; S.trip.name = e.target.value.trim().slice(0, 40) || t('tripDefault'); await DB.put('trips', S.trip); renderAll(); renderMe(); });
  $('#exportBtn').addEventListener('click', exportTrip);
  $('#importBtn').addEventListener('click', () => { const f = $('#importPick'); f.value = ''; f.click(); });
  $('#importPick').addEventListener('change', e => { if (e.target.files[0]) importTrip(e.target.files[0]); });
  confirmTap($('#deleteTrip'), () => S.trip && deleteTrip(S.trip.id));
  $('#keepAwake').addEventListener('change', e => { CFG.keepAwake = e.target.checked; saveCfg(); CFG.keepAwake ? holdWake() : dropWake(); });
  $('#langSel').addEventListener('change', e => { LANG = CFG.lang = e.target.value; saveCfg(); applyI18n(); renderAll(); renderBuddies(); renderMe(); });
  $('#sampleBtn').addEventListener('click', async () => { await loadSample(); setTab('map'); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    holdWake(); if (S.watchId != null) { watch(); poll(); } Share.tick();   // phones often stall location while in the background
  });
  window.addEventListener('online', () => { pumpGeo(); Share.tick(); });
}
async function init() {
  try { Object.assign(CFG, await DB.get('meta', 'cfg') || {}); }
  catch (e) { LANG = pickLang(); applyI18n(); toast(t('storageFail'), 20000); }
  LANG = pickLang(CFG.lang); applyI18n();
  initMap(); bind(); setTab('map');
  try { S.trips = (await DB.all('trips')).sort((a, b) => a.created - b.created); } catch (e) {}
  await loadTrip(S.trips.some(x => x.id === CFG.currentTrip) ? CFG.currentTrip : (S.trips[0] ? S.trips[0].id : null));
  renderBuddies();
  const join = (location.hash.match(/^#join=([A-Za-z0-9]{6})$/) || [])[1];
  if (join) { setTab('buddies'); $('#buddyCode').value = join.toUpperCase(); }
  if (CFG.shareOn) Share.start();
  if (CFG.mode === 'always' || CFG.tracking) startTracking();
  setInterval(renderLive, 1000); setInterval(poll, 20000);
  setInterval(() => { Share.tick(); drawBuddies(); if ($('#app').dataset.tab === 'buddies') renderBuddies(); renderTop(); }, 20000);
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
}
window.__tt = { S, Share, DB, handleFix, importPhotos, cfg: () => CFG };   // handy for debugging in the browser console
init();
</script>
